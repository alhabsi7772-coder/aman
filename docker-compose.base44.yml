services:
  mongo:
    image: mongo:7
    restart: on-failure
    environment:
      - MONGO_INITDB_DATABASE=aman_exchange
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    image: python:3.12-slim
    restart: on-failure
    working_dir: /app/backend
    volumes:
      - ./backend:/app/backend
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - DB_NAME=aman_exchange
      - CORS_ORIGINS=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8000:8000"
    command:
      - sh
      - -ec
      - |
        pip install --no-cache-dir --upgrade pip
        pip install --no-cache-dir \
          fastapi==0.110.1 \
          uvicorn==0.25.0 \
          motor==3.3.1 \
          pymongo==4.5.0 \
          'python-dotenv>=1.0.1' \
          'python-multipart>=0.0.9' \
          'email-validator>=2.2.0' \
          'pydantic>=2.6.4' \
          'python-jose>=3.3.0' \
          'bcrypt==4.1.3' \
          'passlib>=1.7.4'
        exec uvicorn server:app --reload --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    image: node:22
    restart: on-failure
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - DANGEROUSLY_DISABLE_HOST_CHECK=true
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - REACT_APP_BACKEND_URL=https://8000-${BASE44_PUBLIC_HOST_SUFFIX}
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=${BASE44_PUBLIC_HOST_SUFFIX}
    ports:
      - "3000:3000"
    command:
      - sh
      - -ec
      - |
        yarn install --frozen-lockfile
        exec yarn start
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s

volumes:
  mongo_data:
